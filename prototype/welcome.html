<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StudioRelay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }

    .container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bg-photo {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        hsl(200, 40%, 18%) 0%,
        hsl(260, 35%, 22%) 30%,
        hsl(320, 30%, 18%) 60%,
        hsl(40, 35%, 15%) 100%);
      filter: blur(60px) saturate(0.6) brightness(0.3);
      transform: scale(1.3);
      animation: bgFade 2s ease 0.3s both;
    }

    @keyframes bgFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(10,10,10,0.7) 0%, rgba(10,10,10,0.92) 70%);
    }

    .content {
      text-align: center;
      padding: 40px;
      animation: fadeIn 0.8s ease;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4a4a4a;
      margin-bottom: 48px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 300;
      letter-spacing: -0.03em;
      color: #f0f0f0;
      margin-bottom: 56px;
      line-height: 1.1;
    }

    .start-button {
      padding: 20px 80px;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1px solid #333;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s ease;
    }
    .start-button:hover {
      border-color: #555;
    }
    .start-button:active {
      border-color: #4353FF;
      color: #4353FF;
    }

    .hint {
      margin-top: 32px;
      font-size: 13px;
      color: #333;
      font-weight: 300;
      animation: fadeIn 0.8s ease 0.5s both;
    }

    .corner {
      position: absolute;
      bottom: 32px;
      right: 36px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #222;
    }

    .proto-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.95); border-top: 1px solid #1a1a1a;
      padding: 12px 20px; display: flex; gap: 12px; justify-content: center; z-index: 999;
    }
    .proto-nav a {
      color: #444; text-decoration: none; font-size: 11px; letter-spacing: 0.08em;
      padding: 8px 16px; border: 1px solid #1a1a1a; transition: all 0.2s;
    }
    .proto-nav a:hover { color: #888; border-color: #333; }
    .proto-nav a.active { color: #4353FF; border-color: #4353FF; }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-photo"></div>
    <div class="overlay"></div>
    <div class="content">
      <p class="brand">StudioRelay</p>
      <h1>Your session is ready</h1>
      <button class="start-button" onclick="window.location.href='session.html'">Begin</button>
      <p class="hint">Tap to start your photo session</p>
    </div>
    <div class="corner">SR</div>
  </div>

  <nav class="proto-nav">
    <a href="welcome.html" class="active">Welcome</a>
    <a href="session.html">Session</a>
    <a href="review.html">Review</a>
    <a href="qr.html">QR</a>
    <a href="phone-download.html">Phone</a>
  </nav>
</body>
</html>
