<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StudioRelay — Session</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }

    .layout { height: 100%; display: flex; flex-direction: column; }

    .header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 24px 32px 16px; flex-shrink: 0;
    }
    .header-left { display: flex; align-items: baseline; gap: 12px; }
    .header-label {
      font-size: 13px; font-weight: 300; letter-spacing: 0.15em;
      text-transform: uppercase; color: #4a4a4a;
    }
    .header-count { font-size: 13px; color: #666; font-weight: 300; }
    .selected-count { font-size: 13px; color: #2dd4a8; font-weight: 400; letter-spacing: 0.05em; }

    .grid {
      flex: 1; overflow: auto; padding: 8px 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 8px; align-content: start; padding-bottom: 100px;
    }

    .photo-card {
      position: relative; overflow: hidden; cursor: pointer;
      border-radius: 2px; background: #111;
    }

    .photo-inner {
      width: 100%; aspect-ratio: 3 / 2;
      display: flex; align-items: center; justify-content: center;
    }

    /* Checkbox — always visible in corner */
    .checkbox {
      position: absolute; top: 10px; right: 10px;
      width: 32px; height: 32px; border-radius: 2px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
      transition: all 0.2s ease;
    }
    .checkbox.checked {
      background: rgba(45, 212, 168, 0.9);
      border-color: transparent;
    }

    .selected-border {
      position: absolute; inset: 0;
      border: 2px solid rgba(45, 212, 168, 0.5);
      border-radius: 2px; pointer-events: none; display: none;
    }
    .photo-card.selected .selected-border { display: block; }

    /* Full-screen viewer overlay */
    .viewer-overlay {
      position: fixed; inset: 0;
      background: rgba(5, 5, 5, 0.98);
      z-index: 100;
      display: none; align-items: center; justify-content: center;
    }
    .viewer-overlay.open { display: flex; }

    .viewer-photo-area {
      position: relative;
      max-width: 92vw; max-height: 82vh;
    }
    .viewer-photo-area .photo-display {
      max-width: 92vw; max-height: 82vh;
      border-radius: 2px;
    }

    .viewer-checkbox {
      position: absolute; top: 16px; right: 16px;
      width: 48px; height: 48px; border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
      transition: all 0.2s;
    }
    .viewer-checkbox.checked {
      background: rgba(45, 212, 168, 0.95);
      border-color: transparent;
    }

    .viewer-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: #444;
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
    }
    .viewer-arrow:hover { color: #888; }

    .viewer-bottom {
      position: absolute; bottom: 24px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 24px; z-index: 2;
    }
    .viewer-counter { color: #333; font-size: 13px; font-weight: 300; letter-spacing: 0.05em; }
    .viewer-close {
      padding: 10px 24px; font-size: 12px; font-weight: 400;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: transparent; border: 1px solid #222;
      color: #555; font-family: inherit; cursor: pointer;
    }

    .bottom-bar {
      padding: 16px 32px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }
    .continue-btn {
      width: 100%; padding: 18px;
      font-size: 14px; font-weight: 400; letter-spacing: 0.12em;
      text-transform: uppercase; background: transparent;
      border: 1px solid #222; color: #333;
      font-family: inherit; cursor: pointer;
      transition: all 0.3s ease;
    }
    .continue-btn.active { border-color: #2dd4a8; color: #2dd4a8; }

    .proto-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.95); border-top: 1px solid #1a1a1a;
      padding: 12px 20px; display: flex; gap: 12px; justify-content: center; z-index: 200;
    }
    .proto-nav a {
      color: #444; text-decoration: none; font-size: 11px; letter-spacing: 0.08em;
      padding: 8px 16px; border: 1px solid #1a1a1a; transition: all 0.2s;
    }
    .proto-nav a:hover { color: #888; border-color: #333; }
    .proto-nav a.active { color: #4353FF; border-color: #4353FF; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">
      <div class="header-left">
        <span class="header-label">Session</span>
        <span class="header-count" id="photoCount">8 photos</span>
      </div>
      <span class="selected-count" id="badge">3 selected</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="bottom-bar">
      <button class="continue-btn active" id="continueBtn" onclick="window.location.href='review.html'">
        Continue with 3
      </button>
    </div>
  </div>

  <!-- Full-screen photo viewer -->
  <div class="viewer-overlay" id="viewer">
    <div style="position:absolute;inset:0" onclick="closeViewer()"></div>
    <div class="viewer-photo-area" id="viewerPhotoArea"></div>
    <button class="viewer-arrow" style="left:16px" onclick="viewerPrev()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button class="viewer-arrow" style="right:16px" onclick="viewerNext()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <div class="viewer-bottom">
      <span class="viewer-counter" id="viewerCounter">1 / 8</span>
      <button class="viewer-close" onclick="closeViewer()">Back to grid</button>
    </div>
  </div>

  <nav class="proto-nav">
    <a href="welcome.html">Welcome</a>
    <a href="session.html" class="active">Session</a>
    <a href="review.html">Review</a>
    <a href="qr.html">QR</a>
    <a href="phone-download.html">Phone</a>
  </nav>

  <script>
    const grid = document.getElementById('grid');
    const viewer = document.getElementById('viewer');
    const viewerPhotoArea = document.getElementById('viewerPhotoArea');

    const photos = [
      { id: 1, selected: true,  hue: 200 },
      { id: 2, selected: false, hue: 340 },
      { id: 3, selected: true,  hue: 160 },
      { id: 4, selected: false, hue: 280 },
      { id: 5, selected: true,  hue: 40  },
      { id: 6, selected: false, hue: 120 },
      { id: 7, selected: false, hue: 20  },
      { id: 8, selected: false, hue: 260 },
    ];

    let viewerIndex = 0;

    function getSelectedCount() {
      return photos.filter(p => p.selected).length;
    }

    function renderGrid() {
      grid.innerHTML = '';
      photos.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = `photo-card${p.selected ? ' selected' : ''}`;

        card.innerHTML = `
          <div class="photo-inner" style="background:linear-gradient(135deg,
            hsl(${p.hue}, 40%, 15%) 0%,
            hsl(${p.hue + 30}, 35%, 22%) 50%,
            hsl(${p.hue + 60}, 30%, 12%) 100%);"></div>
          <div class="checkbox${p.selected ? ' checked' : ''}" data-index="${i}">
            ${p.selected ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
          <div class="selected-border"></div>
        `;

        // Tap photo → open full-screen viewer
        card.addEventListener('click', (e) => {
          if (e.target.closest('.checkbox')) return;
          openViewer(i);
        });

        // Tap checkbox → toggle select
        card.querySelector('.checkbox').addEventListener('click', (e) => {
          e.stopPropagation();
          p.selected = !p.selected;
          renderGrid();
        });

        grid.appendChild(card);
      });

      updateUI();
    }

    function updateUI() {
      const count = getSelectedCount();
      const badge = document.getElementById('badge');
      badge.textContent = `${count} selected`;
      badge.style.display = count > 0 ? 'inline' : 'none';

      const btn = document.getElementById('continueBtn');
      if (count > 0) {
        btn.className = 'continue-btn active';
        btn.textContent = `Continue with ${count}`;
      } else {
        btn.className = 'continue-btn';
        btn.textContent = 'Select your photos';
      }
    }

    function openViewer(index) {
      viewerIndex = index;
      renderViewer();
      viewer.classList.add('open');
    }

    function closeViewer() {
      viewer.classList.remove('open');
    }

    function viewerNext() {
      if (viewerIndex < photos.length - 1) {
        viewerIndex++;
        renderViewer();
      }
    }

    function viewerPrev() {
      if (viewerIndex > 0) {
        viewerIndex--;
        renderViewer();
      }
    }

    function renderViewer() {
      const p = photos[viewerIndex];
      viewerPhotoArea.innerHTML = `
        <div class="photo-display" style="
          width: 80vw; height: 55vh;
          background: linear-gradient(135deg,
            hsl(${p.hue}, 40%, 15%) 0%,
            hsl(${p.hue + 30}, 35%, 22%) 50%,
            hsl(${p.hue + 60}, 30%, 12%) 100%);
          border-radius: 2px;
        "></div>
        <div class="viewer-checkbox${p.selected ? ' checked' : ''}" onclick="toggleViewerSelect()">
          ${p.selected
            ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
            : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"><polyline points="20 6 9 17 4 12"/></svg>'
          }
        </div>
      `;
      document.getElementById('viewerCounter').textContent = `${viewerIndex + 1} / ${photos.length}`;
    }

    function toggleViewerSelect() {
      photos[viewerIndex].selected = !photos[viewerIndex].selected;
      renderViewer();
      renderGrid();
    }

    // Keyboard nav
    document.addEventListener('keydown', (e) => {
      if (!viewer.classList.contains('open')) return;
      if (e.key === 'ArrowRight') viewerNext();
      if (e.key === 'ArrowLeft') viewerPrev();
      if (e.key === 'Escape') closeViewer();
      if (e.key === ' ') { e.preventDefault(); toggleViewerSelect(); }
    });

    renderGrid();
  </script>
</body>
</html>
