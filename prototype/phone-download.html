<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudioRelay — Your Photos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      padding: 32px 20px;
      padding-bottom: 120px;
      max-width: 420px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: #333; margin-bottom: 32px;
    }

    h1 {
      font-size: 20px; font-weight: 300;
      letter-spacing: -0.01em; text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center; color: #555;
      margin-bottom: 28px; font-size: 13px; font-weight: 300;
    }

    .zip-btn {
      display: block; width: 100%;
      padding: 16px; background: #4353FF;
      color: #fff; text-align: center;
      text-decoration: none; font-size: 13px;
      font-weight: 400; letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .zip-btn:active { opacity: 0.8; }

    .divider {
      text-align: center; color: #2a2a2a;
      font-size: 11px; margin: 24px 0;
      letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 300;
    }

    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    .photo {
      position: relative; overflow: hidden;
    }

    .photo-inner {
      width: 100%; aspect-ratio: 3 / 2;
    }

    .dl-btn {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.6); color: #999;
      padding: 6px 12px; text-decoration: none;
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.05em;
    }
    .dl-btn:active { color: #fff; }

    .footer-brand {
      text-align: center; margin-top: 40px;
      color: #1a1a1a; font-size: 10px;
      letter-spacing: 0.15em; text-transform: uppercase;
      font-weight: 300;
    }

    @media (min-width: 500px) {
      body {
        margin-top: 40px;
        border: 1px solid #1a1a1a;
        min-height: 700px;
      }
      body::before {
        content: 'Phone Preview';
        display: block; text-align: center;
        color: #2a2a2a; font-size: 10px;
        text-transform: uppercase; letter-spacing: 0.15em;
        margin-bottom: 24px; font-weight: 300;
      }
    }

    .proto-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.95); border-top: 1px solid #1a1a1a;
      padding: 12px 20px; display: flex; gap: 12px; justify-content: center; z-index: 999;
    }
    .proto-nav a {
      color: #444; text-decoration: none; font-size: 11px; letter-spacing: 0.08em;
      padding: 8px 16px; border: 1px solid #1a1a1a; transition: all 0.2s;
    }
    .proto-nav a:hover { color: #888; border-color: #333; }
    .proto-nav a.active { color: #4353FF; border-color: #4353FF; }
  </style>
</head>
<body>
  <p class="brand">StudioRelay</p>
  <h1>Your photos</h1>
  <p class="subtitle">3 photos selected</p>

  <a href="#" class="zip-btn">Download all</a>

  <p class="divider">or individually</p>

  <div class="grid">
    <div class="photo">
      <div class="photo-inner" style="background:linear-gradient(135deg, hsl(200,40%,15%), hsl(230,35%,22%), hsl(260,30%,12%));"></div>
      <a href="#" class="dl-btn">Save</a>
    </div>
    <div class="photo">
      <div class="photo-inner" style="background:linear-gradient(135deg, hsl(160,40%,15%), hsl(190,35%,22%), hsl(220,30%,12%));"></div>
      <a href="#" class="dl-btn">Save</a>
    </div>
    <div class="photo">
      <div class="photo-inner" style="background:linear-gradient(135deg, hsl(40,40%,15%), hsl(70,35%,22%), hsl(100,30%,12%));"></div>
      <a href="#" class="dl-btn">Save</a>
    </div>
  </div>

  <p class="footer-brand">StudioRelay</p>

  <nav class="proto-nav">
    <a href="welcome.html">Welcome</a>
    <a href="session.html">Session</a>
    <a href="review.html">Review</a>
    <a href="qr.html">QR</a>
    <a href="phone-download.html" class="active">Phone</a>
  </nav>
</body>
</html>
